name: CI

# Builds and smoke-tests on both hosts After Effects runs on. The CEP install
# path cannot be tested here (no AE on a runner), but this does catch the things
# that actually break a port: platform-specific path handling, module
# resolution, and the server failing to start.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci
      - run: npm run build

      - name: Version strings agree
        run: node scripts/sync-version.mjs --check

      - name: Server starts and lists its tools
        shell: bash
        run: |
          node -e '
            const {spawn}=require("child_process");
            const c=spawn(process.execPath,["packages/mcp-server/dist/index.js"],{stdio:["pipe","pipe","inherit"]});
            let buf="",id=0;const pend=new Map();
            c.stdout.on("data",d=>{buf+=d;let i;while((i=buf.indexOf("\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);
              if(!l.trim())continue;try{const m=JSON.parse(l);if(m.id&&pend.has(m.id)){pend.get(m.id)(m);pend.delete(m.id);}}catch{}}});
            const send=(m,p)=>new Promise(r=>{const my=++id;pend.set(my,r);c.stdin.write(JSON.stringify({jsonrpc:"2.0",id:my,method:m,params:p})+"\n");});
            (async()=>{
              await send("initialize",{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"ci",version:"1"}});
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})+"\n");
              const t=await send("tools/list",{});
              const n=t.result.tools.length;
              if(n<63){console.error(`expected >=63 tools, got ${n}`);process.exit(1);}
              console.log(`${n} tools on ${process.platform}`);
              c.kill();process.exit(0);
            })();'

      - name: check_setup resolves platform paths without throwing
        shell: bash
        run: |
          node -e '
            import("./packages/mcp-server/dist/setup/check.js").then(async m=>{
              const r=await m.checkSetup();
              const platform=r.checks.find(c=>c.name==="platform");
              const assets=r.checks.find(c=>c.name==="panelAssetsPresent");
              console.log(`platform ok=${platform.ok} (${platform.detail})`);
              console.log(`panel assets ok=${assets.ok}`);
              // AE is not installed on a runner, so only these two must hold.
              if(!platform.ok||!assets.ok) process.exit(1);
            }).catch(e=>{console.error(e);process.exit(1);});'

      - name: Scaffold works
        shell: bash
        run: |
          node packages/mcp-server/dist/index.js init ci-project --with-mcp
          test -f ci-project/CLAUDE.md
          test -f ci-project/.claude/skills/house-style/SKILL.md
          test -f ci-project/.claude/commands/report-ae-issue.md
          test -f ci-project/.mcp.json
          echo "scaffold ok"

      # The journal is the one piece of state this server owns, and its round
      # trip has to survive a Windows path and a hand-edited file.
      - name: Issue journal round-trips
        shell: bash
        env:
          AE_MCP_HOME: ${{ runner.temp }}/ae-mcp-home
        run: |
          node -e '
            import("./packages/mcp-server/dist/issues/journal.js").then(j=>{
              const first=j.logIssue({title:"Example: a tool failed oddly",symptom:"boom",workaround:"do it the other way",cause:"because",tools:["run_jsx"]});
              if(first.previouslyLogged||first.occurrences!==1) throw new Error("first log should be new");
              j.markReported(first.id,"https://example.invalid/1");
              const again=j.logIssue({title:"Example: A TOOL FAILED ODDLY!",symptom:"boom again",workaround:"same"});
              if(again.id!==first.id) throw new Error(`title should map to one id: ${again.id} vs ${first.id}`);
              if(again.occurrences!==2) throw new Error("re-log should count the sighting");
              if(!again.reported) throw new Error("a new sighting must not un-report an entry");
              const all=j.listIssues("all"), open=j.listIssues("unreported");
              if(all.count!==1||open.count!==0) throw new Error(`status filter wrong: ${all.count}/${open.count}`);
              if(all.issues[0].cause!=="because") throw new Error("a known cause must survive a sighting logged without one");
              console.log(`journal ok at ${all.dir}`);
            }).catch(e=>{console.error(e);process.exit(1);});'
