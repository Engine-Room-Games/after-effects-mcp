name: CI

# Builds and smoke-tests on both hosts After Effects runs on. The CEP install
# path cannot be tested here (no AE on a runner), but this does catch the things
# that actually break a port: platform-specific path handling, module
# resolution, and the server failing to start.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        # Both LTS lines that are still supported. 20 went EOL 2026-04-30;
        # release.yml builds on 24, so 24 must stay in here.
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - run: npm ci
      - run: npm run build

      - name: Version strings agree
        run: node scripts/sync-version.mjs --check

      # The skills and commands under plugin/ are generated from the guide and
      # prompt sources. A hand-edit there would be silently overwritten by the
      # next build, so it has to fail here instead.
      - name: Generated guides and prompts are in sync
        run: node scripts/build-guides.mjs --check

      - name: Server starts and lists its tools
        shell: bash
        run: |
          node -e '
            const {spawn}=require("child_process");
            const c=spawn(process.execPath,["packages/mcp-server/dist/index.js"],{stdio:["pipe","pipe","inherit"]});
            let buf="",id=0;const pend=new Map();
            c.stdout.on("data",d=>{buf+=d;let i;while((i=buf.indexOf("\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);
              if(!l.trim())continue;try{const m=JSON.parse(l);if(m.id&&pend.has(m.id)){pend.get(m.id)(m);pend.delete(m.id);}}catch{}}});
            const send=(m,p)=>new Promise(r=>{const my=++id;pend.set(my,r);c.stdin.write(JSON.stringify({jsonrpc:"2.0",id:my,method:m,params:p})+"\n");});
            (async()=>{
              await send("initialize",{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"ci",version:"1"}});
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})+"\n");
              const t=await send("tools/list",{});
              const n=t.result.tools.length;
              if(n<67){console.error(`expected >=67 tools, got ${n}`);process.exit(1);}
              console.log(`${n} tools on ${process.platform}`);
              c.kill();process.exit(0);
            })();'

      # The carriers that reach non-Claude clients: without these, everyone
      # outside Claude Code gets the tools and none of the guidance.
      - name: Instructions, prompts and resources are served
        shell: bash
        run: |
          node -e '
            const {spawn}=require("child_process");
            const c=spawn(process.execPath,["packages/mcp-server/dist/index.js"],{stdio:["pipe","pipe","inherit"]});
            let buf="",id=0;const pend=new Map();
            c.stdout.on("data",d=>{buf+=d;let i;while((i=buf.indexOf("\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);
              if(!l.trim())continue;try{const m=JSON.parse(l);if(m.id&&pend.has(m.id)){pend.get(m.id)(m);pend.delete(m.id);}}catch{}}});
            const send=(m,p)=>new Promise(r=>{const my=++id;pend.set(my,r);c.stdin.write(JSON.stringify({jsonrpc:"2.0",id:my,method:m,params:p})+"\n");});
            const fail=m=>{console.error(m);process.exit(1);};
            (async()=>{
              const init=await send("initialize",{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"ci",version:"1"}});
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})+"\n");
              if(!init.result.instructions?.includes("get_house_style")) fail("initialize did not carry instructions");
              for(const k of ["prompts","resources"]) if(!init.result.capabilities[k]) fail(`capability ${k} missing`);
              const prompts=(await send("prompts/list",{})).result.prompts;
              if(prompts.length<3) fail(`expected 3 prompts, got ${prompts.length}`);
              const got=await send("prompts/get",{name:"report-ae-issue",arguments:{arguments:"xyzzy"}});
              const text=got.result.messages[0].content.text;
              if(text.includes("$ARGUMENTS")||!text.includes("xyzzy")) fail("prompt arguments were not substituted");
              const res=(await send("resources/list",{})).result.resources;
              if(res.length<3) fail(`expected 3 resources, got ${res.length}`);
              const read=await send("resources/read",{uri:"ae://guide/after-effects"});
              if(!read.result.contents[0].text.startsWith("# Driving After Effects")) fail("resource body wrong");
              const guide=await send("tools/call",{name:"ae_guide",arguments:{topic:"style-guide"}});
              if(guide.result.isError) fail("ae_guide errored");
              console.log(`instructions ${init.result.instructions.length} chars, ${prompts.length} prompts, ${res.length} resources`);
              c.kill();process.exit(0);
            })();'

      # Every branch here is a different sentence said to a user mid-upgrade,
      # and none of them are reachable from a normal green-path run.
      - name: Panel version mismatches are diagnosed correctly
        run: node tests/unit/panel-version.mjs

      - name: check_setup resolves platform paths without throwing
        shell: bash
        run: |
          node -e '
            import("./packages/mcp-server/dist/setup/check.js").then(async m=>{
              const r=await m.checkSetup();
              const platform=r.checks.find(c=>c.name==="platform");
              const assets=r.checks.find(c=>c.name==="panelAssetsPresent");
              console.log(`platform ok=${platform.ok} (${platform.detail})`);
              console.log(`panel assets ok=${assets.ok}`);
              // AE is not installed on a runner, so only these two must hold.
              if(!platform.ok||!assets.ok) process.exit(1);
            }).catch(e=>{console.error(e);process.exit(1);});'

      # Both entry points into the same scaffold: the terminal one, and the
      # init_project tool that clients without filesystem access rely on.
      - name: Scaffold works from the CLI
        shell: bash
        run: |
          node packages/mcp-server/dist/index.js init ci-project --with-mcp
          test -f ci-project/AGENTS.md
          test -f ci-project/CLAUDE.md
          test -f ci-project/.mcp.json
          test -f ci-project/renders/.gitkeep
          node packages/mcp-server/dist/index.js init ci-cursor --client cursor --with-mcp
          test -f ci-cursor/.cursor/rules/after-effects.mdc
          test -f ci-cursor/.cursor/mcp.json
          echo "scaffold ok"

      - name: Scaffold works from the tool, and refuses to clobber
        shell: bash
        run: |
          mkdir -p ci-tool-project
          node -e '
            const {spawn}=require("child_process");
            const path=require("path"),fs=require("fs");
            const entry=path.resolve("packages/mcp-server/dist/index.js");
            const cwd=path.resolve("ci-tool-project");
            const c=spawn(process.execPath,[entry],{stdio:["pipe","pipe","inherit"],cwd});
            let buf="",id=0;const pend=new Map();
            c.stdout.on("data",d=>{buf+=d;let i;while((i=buf.indexOf("\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);
              if(!l.trim())continue;try{const m=JSON.parse(l);if(m.id&&pend.has(m.id)){pend.get(m.id)(m);pend.delete(m.id);}}catch{}}});
            const send=(m,p)=>new Promise(r=>{const my=++id;pend.set(my,r);c.stdin.write(JSON.stringify({jsonrpc:"2.0",id:my,method:m,params:p})+"\n");});
            const fail=m=>{console.error(m);process.exit(1);};
            (async()=>{
              await send("initialize",{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"cursor",version:"1"}});
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})+"\n");
              const first=await send("tools/call",{name:"init_project",arguments:{}});
              if(first.result.isError) fail(`init_project failed: ${first.result.content[0].text}`);
              const r=JSON.parse(first.result.content[0].text);
              if(r.client!=="cursor") fail(`client detection wrong: ${r.client}`);
              for(const rel of r.written) if(!fs.existsSync(path.join(r.dir,rel))) fail(`claimed ${rel} but it is missing`);
              const again=await send("tools/call",{name:"init_project",arguments:{}});
              if(!again.result.isError) fail("a second init_project must refuse rather than overwrite");
              console.log(`init_project wrote ${r.written.join(", ")} for ${r.client}`);
              c.kill();process.exit(0);
            })();'

      # The journal is the one piece of state this server owns, and its round
      # trip has to survive a Windows path and a hand-edited file.
      - name: Issue journal round-trips
        shell: bash
        env:
          AE_MCP_HOME: ${{ runner.temp }}/ae-mcp-home
        run: |
          node -e '
            const fs=require("fs"),path=require("path");
            import("./packages/mcp-server/dist/issues/journal.js").then(j=>{
              const first=j.logIssue({title:"Example: a tool failed oddly",symptom:"boom",workaround:"do it the other way",cause:"because",tools:["run_jsx"]});
              if(first.previouslyLogged||first.occurrences!==1) throw new Error("first log should be new");
              j.markReported(first.id,"https://example.invalid/1");
              const again=j.logIssue({title:"Example: A TOOL FAILED ODDLY!",symptom:"boom again",workaround:"same"});
              if(again.id!==first.id) throw new Error(`title should map to one id: ${again.id} vs ${first.id}`);
              if(again.occurrences!==2) throw new Error("re-log should count the sighting");
              if(!again.reported) throw new Error("a new sighting must not un-report an entry");
              const all=j.listIssues("all"), open=j.listIssues("unreported");
              if(all.count!==1||open.count!==0) throw new Error(`status filter wrong: ${all.count}/${open.count}`);
              if(all.issues[0].cause!=="because") throw new Error("a known cause must survive a sighting logged without one");
              // Untracked by construction, not by asking the project to ignore it.
              const ignore=path.join(all.dir,"..",".gitignore");
              if(fs.readFileSync(ignore,"utf8").trim()!=="*") throw new Error(`journal must ignore itself: ${ignore}`);
              console.log(`journal ok at ${all.dir} (scope ${all.scope})`);
            }).catch(e=>{console.error(e);process.exit(1);});'
