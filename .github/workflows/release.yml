name: Release

# Publishes to npm when a v* tag is pushed.
#
# Authentication is OIDC trusted publishing: GitHub proves this workflow's
# identity to npm directly and npm mints a short-lived credential for the job.
# There is no NPM_TOKEN — nothing to rotate, nothing to leak. npm also attaches
# a provenance attestation automatically, linking the published tarball to this
# commit and workflow.
#
# One-time setup, in this order:
#   1. `npm publish` once from a laptop to create the package
#   2. npmjs.com -> the package -> Settings -> Trusted Publisher:
#        repository  Engine-Room-Games/after-effects-mcp
#        workflow    release.yml
#   3. every release after that is `git tag v0.1.1 && git push --tags`

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Two jobs, so the credential and the build never share a process (issue #171).
# `build` runs every install and lifecycle script there is — npm ci, prepack —
# with no OIDC token in reach, and hands on one tarball. `publish` holds the
# token and runs no package code at all: it downloads that tarball and
# publishes it with --ignore-scripts.
#
# Both jobs use the same pinned npm, never npm@latest: the tarball is packed and
# published by a version that was chosen, and a new npm release cannot change
# either step between one tag and the next. OIDC trusted publishing needs
# npm >= 11.5.1. Bump NPM_VERSION deliberately.
env:
  NPM_VERSION: "11.6.2"
  NODE_VERSION: "24"

jobs:
  build:
    runs-on: macos-latest # the package declares os:["darwin"]; build and verify where it runs
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned npm
        run: npm install -g "npm@${NPM_VERSION}"

      # Recorded in the log of the run that built what npm serves.
      - name: Toolchain
        run: |
          echo "node $(node --version)"
          echo "npm  $(npm --version)"

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/mcp-server/package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PKG" >&2
            exit 1
          fi
          echo "Publishing version $PKG"

      # The one tarball both the smoke test below and the publish job use: what
      # was run here is byte for byte what reaches npm.
      - name: Pack
        id: pack
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack -w @engine-room/after-effects-mcp --pack-destination "$RUNNER_TEMP/pkg"
          TARBALL=$(cd "$RUNNER_TEMP/pkg" && ls engine-room-after-effects-mcp-*.tgz)
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Verify the packed tarball actually runs
        run: |
          set -euo pipefail
          TARBALL="$RUNNER_TEMP/pkg/${{ steps.pack.outputs.tarball }}"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$TARBALL" >/dev/null
          # The panel must resolve from the published layout, not the checkout.
          node -e '
            const {spawn}=require("child_process");
            const c=spawn("./node_modules/.bin/after-effects-mcp",[],{stdio:["pipe","pipe","inherit"]});
            let buf="",id=0;const pend=new Map();
            c.stdout.on("data",d=>{buf+=d;let i;while((i=buf.indexOf("\n"))>=0){const l=buf.slice(0,i);buf=buf.slice(i+1);
              if(!l.trim())continue;try{const m=JSON.parse(l);if(m.id&&pend.has(m.id)){pend.get(m.id)(m);pend.delete(m.id);}}catch{}}});
            const send=(method,params)=>new Promise(r=>{const my=++id;pend.set(my,r);
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",id:my,method,params})+"\n");});
            (async()=>{
              await send("initialize",{protocolVersion:"2024-11-05",capabilities:{},clientInfo:{name:"ci",version:"1"}});
              c.stdin.write(JSON.stringify({jsonrpc:"2.0",method:"notifications/initialized"})+"\n");
              const t=await send("tools/list",{});
              const n=t.result.tools.length;
              if(n<74){console.error(`expected >=74 tools, got ${n}`);process.exit(1);}
              const r=await send("tools/call",{name:"check_setup",arguments:{}});
              const rep=JSON.parse(r.result.content[0].text);
              const assets=rep.checks.find(x=>x.name==="panelAssetsPresent");
              if(!assets.ok){console.error("panel assets missing from tarball:",assets.detail);process.exit(1);}
              console.log(`OK: ${n} tools, panel at ${assets.detail}`);
              c.kill();process.exit(0);
            })();'

      # npm only *warns* when it rewrites the manifest at publish time, and a
      # dropped bin entry is invisible until someone's npx fails. Treat any
      # auto-correction as a release blocker.
      - name: Fail on manifest auto-correction
        run: |
          set -euo pipefail
          out=$(npm publish -w @engine-room/after-effects-mcp --dry-run 2>&1)
          echo "$out"
          if grep -qE "invalid and removed|auto-corrected" <<<"$out"; then
            echo "::error::npm rewrote the manifest on publish — fix package.json before releasing." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: macos-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      # NOTE: deliberately no `registry-url`. It makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into .npmrc; with
      # no NODE_AUTH_TOKEN set, npm sees an empty token, decides auth is already
      # configured, and never starts the OIDC exchange.
      # See https://github.com/actions/setup-node/issues/1551
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install the pinned npm
        run: |
          npm install -g "npm@${NPM_VERSION}"
          npm --version

      - name: Confirm the OIDC environment is present
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::No OIDC token endpoint — the job is missing id-token: write." >&2
            exit 1
          fi
          if [ -f .npmrc ] && grep -q "_authToken" .npmrc; then
            echo "::error::.npmrc contains an _authToken line; npm will skip OIDC. Remove registry-url from setup-node." >&2
            exit 1
          fi
          echo "OIDC endpoint present, no conflicting .npmrc"

      - uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/pkg

      # No checkout, no npm ci, no lifecycle scripts: nothing from the package
      # runs in the job that holds the publish credential.
      - name: Publish
        run: npm publish "$RUNNER_TEMP/pkg/${{ needs.build.outputs.tarball }}" --ignore-scripts --provenance
