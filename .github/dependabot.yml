# Dependency updates, grouped so a week's bumps arrive as one PR per ecosystem
# rather than one per package (issue #171). Every Dependabot PR runs ci.yml like
# any other pull request; merge only once it is green on both hosts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The types must match the oldest Node we support (engines: >=22), or the
      # compiler accepts APIs that crash on a user's Node 22.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 (the Go port) ships no compiler API yet, and
      # tests/unit/schema-handler-contract.mjs parses sources with it.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
